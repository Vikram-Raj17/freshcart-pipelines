name: iris_classifier
# Mage project pipeline definition. Open the project in Mage and confirm the
# generated block UUIDs/metadata match the installed Mage version before running.
blocks:
  - uuid: load_iris
    type: data_loader
    name: load_iris
  - uuid: validate_iris
    type: transformer
    name: validate_iris
    upstream_blocks: [load_iris]
  - uuid: prepare_data
    type: transformer
    name: prepare_data
    upstream_blocks: [validate_iris]
  - uuid: train_model
    type: transformer
    name: train_model
    upstream_blocks: [prepare_data]
  - uuid: save_results
    type: data_exporter
    name: save_results
    upstream_blocks: [train_model]
  - uuid: evaluate_model
    type: transformer
    name: evaluate_model
    upstream_blocks: [train_model]
